<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRM — Compatibility Matrix</title>
  <link rel="stylesheet" href="/admin/app.css">
  <style>
    body { margin: 0; }

    .docs-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20;
    }
    .docs-brand { display: flex; align-items: center; gap: 10px; }
    .docs-brand .logo {
      display: grid; place-items: center; width: 30px; height: 30px;
      background: var(--accent); color: #fff; border-radius: 8px; font-size: 15px;
    }
    .docs-brand strong { font-size: 1.05rem; letter-spacing: 0.04em; }
    .docs-brand .eyebrow {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); padding-left: 8px; border-left: 1px solid var(--line);
      margin: 0 0 0 4px;
    }
    .docs-topbar .back {
      color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;
    }
    .docs-topbar .back:hover { color: var(--accent-dark); }

    .docs-shell {
      display: grid; grid-template-columns: 240px minmax(0, 1fr);
      max-width: 1200px; margin: 0 auto; gap: 32px; padding: 32px 24px;
    }
    .docs-toc {
      position: sticky; top: 72px; align-self: start; font-size: 13px;
      max-height: calc(100vh - 100px); overflow-y: auto;
    }
    .docs-toc .eyebrow { color: var(--muted); margin: 0 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .docs-toc ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
    .docs-toc a {
      display: block; padding: 6px 10px; border-radius: 6px;
      color: var(--muted); text-decoration: none; border-left: 2px solid transparent;
    }
    .docs-toc a:hover { background: rgba(164, 91, 19, 0.06); color: var(--accent-dark); }
    .docs-toc a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(164, 91, 19, 0.06); font-weight: 600; }
    .docs-toc .empty { color: var(--muted); font-style: italic; font-size: 12px; }

    .docs-content h1 { margin: 0 0 4px 0; }
    .docs-content .lead { color: var(--muted); margin: 0 0 12px 0; }

    .controls {
      display: flex; gap: 8px; align-items: center; margin: 16px 0;
      padding: 12px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface);
    }
    .controls label { font-size: 0.85rem; color: var(--muted); }
    .controls input {
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px;
      min-width: 320px; font-family: monospace; font-size: 0.85rem;
    }
    .controls button {
      padding: 6px 14px; background: var(--accent); color: white; border: none;
      border-radius: 4px; font-weight: 600; cursor: pointer;
    }
    .controls button:hover { background: var(--accent-dark); }

    .category {
      margin: 18px 0; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; background: var(--surface); scroll-margin-top: 80px;
    }
    .category h2 {
      font-size: 1rem; margin: 0; padding: 10px 14px;
      background: rgba(164, 91, 19, 0.06); color: var(--accent-dark);
      border-bottom: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 14px; font-size: 0.9rem; text-align: left; }
    thead tr { border-bottom: 1px solid var(--line); }
    tbody tr + tr { border-top: 1px solid var(--line); }
    .status-badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .status-verified { background: #ecfdf5; color: #047857; }
    .status-warn { background: #fef3c7; color: #92400e; }
    .status-broken { background: #fee2e2; color: #b91c1c; }
    #status { margin-top: 12px; color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 900px) {
      .docs-shell { grid-template-columns: 1fr; }
      .docs-toc { position: static; max-height: none; }
    }
  </style>
</head>
<body>
  <header class="docs-topbar">
    <div class="docs-brand">
      <span class="logo" aria-hidden="true">🔒</span>
      <strong>DRM</strong>
      <span class="eyebrow">Reference</span>
    </div>
    <a href="/admin/" class="back">&larr; Admin console</a>
  </header>

  <div class="docs-shell">
    <aside class="docs-toc" aria-label="Page contents">
      <p class="eyebrow">Categories</p>
      <ul id="tocList"><li class="empty">Load the matrix to see categories</li></ul>
    </aside>

    <main class="docs-content">
      <h1>DRM Compatibility Matrix</h1>
      <p class="lead">Verified document, design, CAD, video, and simulation applications. Each entry was last validated against the DRM viewer and protect workflow on Windows 11.</p>

      <div class="controls">
        <label for="adminKeyInput">X-DRM-Admin-Key</label>
        <input id="adminKeyInput" type="password" placeholder="Paste admin key">
        <button id="loadBtn" type="button">Load matrix</button>
        <span id="status"></span>
      </div>

      <div id="matrixHost"></div>
    </main>
  </div>

  <script>
    const adminKeyInput = document.querySelector("#adminKeyInput");
    const statusEl = document.querySelector("#status");
    const host = document.querySelector("#matrixHost");
    const tocList = document.querySelector("#tocList");

    function escapeHtml(s) {
      return (s ?? "").toString()
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function slugify(s) {
      return (s ?? "").toString().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    document.querySelector("#loadBtn").addEventListener("click", async () => {
      const key = adminKeyInput.value.trim();
      if (!key) { statusEl.textContent = "Admin key required"; return; }
      statusEl.textContent = "Loading…";
      try {
        const res = await fetch("/api/admin/compatibility-matrix", {
          headers: { "X-DRM-Admin-Key": key }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
        renderToc(data);
        statusEl.textContent = `Generated ${data.generatedAtUtc} • ${data.knownIssueCount} known issue${data.knownIssueCount === 1 ? "" : "s"}`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        host.innerHTML = "";
        tocList.innerHTML = '<li class="empty">Load the matrix to see categories</li>';
      }
    });

    function render(data) {
      host.innerHTML = data.categories.map((cat) => `
        <section class="category" id="cat-${slugify(cat.name)}">
          <h2>${escapeHtml(cat.name)}</h2>
          <table>
            <thead>
              <tr>
                <th style="width:36%">Application</th>
                <th style="width:30%">Versions</th>
                <th style="width:12%">Status</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              ${cat.entries.map((e) => `
                <tr>
                  <td>${escapeHtml(e.application)}</td>
                  <td><code>${escapeHtml(e.versions)}</code></td>
                  <td><span class="status-badge status-${escapeHtml(e.status)}">${escapeHtml(e.status)}</span></td>
                  <td>${e.notes ? escapeHtml(e.notes) : ""}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </section>
      `).join("");
    }

    function renderToc(data) {
      tocList.innerHTML = data.categories.map((cat) => {
        const id = "cat-" + slugify(cat.name);
        return `<li><a href="#${id}" data-id="${id}">${escapeHtml(cat.name)} <span style="opacity:.5">${cat.entries.length}</span></a></li>`;
      }).join("");
      window.addEventListener("scroll", scrollSpy, { passive: true });
      scrollSpy();
    }

    function scrollSpy() {
      const sections = [...document.querySelectorAll(".category")];
      if (!sections.length) return;
      const y = window.scrollY + 120;
      let activeId = sections[0].id;
      for (const s of sections) {
        if (s.offsetTop <= y) activeId = s.id;
      }
      tocList.querySelectorAll("a").forEach((a) => {
        a.classList.toggle("active", a.dataset.id === activeId);
      });
    }
  </script>
</body>
</html>
