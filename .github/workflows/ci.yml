name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test-linux:
    name: Build & test (Linux — non-Windows projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore non-Windows projects
        run: |
          dotnet restore src/Drm.Domain/Drm.Domain.csproj
          dotnet restore src/Drm.Crypto/Drm.Crypto.csproj
          dotnet restore src/Drm.Container/Drm.Container.csproj
          dotnet restore src/Drm.Agent.Core/Drm.Agent.Core.csproj
          dotnet restore src/Drm.Cli/Drm.Cli.csproj
          dotnet restore src/Drm.Server/Drm.Server.csproj
          dotnet restore src/Drm.FolderWatcher.Service/Drm.FolderWatcher.Service.csproj
          dotnet restore tests/Drm.Domain.Tests/Drm.Domain.Tests.csproj
          dotnet restore tests/Drm.Crypto.Tests/Drm.Crypto.Tests.csproj
          dotnet restore tests/Drm.Container.Tests/Drm.Container.Tests.csproj
          dotnet restore tests/Drm.Agent.Core.Tests/Drm.Agent.Core.Tests.csproj
          dotnet restore tests/Drm.Cli.Tests/Drm.Cli.Tests.csproj
          dotnet restore tests/Drm.Server.Tests/Drm.Server.Tests.csproj
          dotnet restore tests/Drm.Watermark.Tests/Drm.Watermark.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Drm.Server/Drm.Server.csproj --no-restore -c Release
          dotnet build src/Drm.FolderWatcher.Service/Drm.FolderWatcher.Service.csproj --no-restore -c Release
          dotnet build src/Drm.Cli/Drm.Cli.csproj --no-restore -c Release

      - name: Test — Domain
        run: dotnet test tests/Drm.Domain.Tests/Drm.Domain.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Crypto
        run: dotnet test tests/Drm.Crypto.Tests/Drm.Crypto.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Container
        run: dotnet test tests/Drm.Container.Tests/Drm.Container.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Agent.Core
        run: dotnet test tests/Drm.Agent.Core.Tests/Drm.Agent.Core.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — CLI
        run: dotnet test tests/Drm.Cli.Tests/Drm.Cli.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Server (main suite)
        run: dotnet test tests/Drm.Server.Tests/Drm.Server.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Watermark
        run: dotnet test tests/Drm.Watermark.Tests/Drm.Watermark.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

      - name: Test — Integration
        run: dotnet test tests/Drm.Integration.Tests/Drm.Integration.Tests.csproj -c Release --logger "console;verbosity=normal"

  ui-tests-linux:
    name: UI tests (Linux — Playwright/Chromium)
    # Drm.UI.Tests drives a REAL Chromium against a REAL Drm.Server process —
    # it is the only automated proof that the admin console, /share/ viewer,
    # and in-browser .drmx decryption actually work in a browser. Until this
    # job existed the suite only ever ran on the dev machine, so a regression
    # in wwwroot JS/HTML could land on master with CI fully green.
    # Runs as its own job (not a step in build-and-test-linux) so a browser
    # flake never masks a unit-test failure and the suites run in parallel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Drm.UI.Tests/Drm.UI.Tests.csproj

      - name: Build test project (Release)
        run: dotnet build tests/Drm.UI.Tests/Drm.UI.Tests.csproj --no-restore -c Release

      - name: Pre-build server (Debug)
        # DrmServerFixture starts the server with `dotnet run` (Debug config)
        # and waits only 45 s for /healthz. A cold restore+build inside that
        # window is the one thing that would make this job flaky, so warm the
        # Debug build here where it doesn't count against the deadline.
        run: dotnet build src/Drm.Server/Drm.Server.csproj -c Debug

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Drm.UI.Tests/Drm.UI.Tests.csproj') }}

      - name: Install Playwright Chromium + OS deps
        # PlaywrightFixture self-installs the browser at run time, but it
        # skips OS-level dependencies; --with-deps here covers both (and is
        # a fast no-op for the browser itself on a cache hit).
        run: pwsh tests/Drm.UI.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test — UI (Playwright)
        run: dotnet test tests/Drm.UI.Tests/Drm.UI.Tests.csproj --no-restore -c Release --logger "console;verbosity=normal"

  build-windows:
    name: Build (Windows — WPF projects)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows projects
        run: |
          dotnet restore src/Drm.Agent.Tray.Windows/Drm.Agent.Tray.Windows.csproj
          dotnet restore src/Drm.Agent.Service.Windows/Drm.Agent.Service.Windows.csproj
          dotnet restore src/Drm.Viewer.Windows/Drm.Viewer.Windows.csproj

      - name: Build Tray
        run: dotnet build src/Drm.Agent.Tray.Windows/Drm.Agent.Tray.Windows.csproj --no-restore -c Release

      - name: Build Service
        run: dotnet build src/Drm.Agent.Service.Windows/Drm.Agent.Service.Windows.csproj --no-restore -c Release

      - name: Build Viewer
        run: dotnet build src/Drm.Viewer.Windows/Drm.Viewer.Windows.csproj --no-restore -c Release

  msi-build-and-verify:
    name: MSI — build & verify on Windows
    # Stage 2 of the easy-install agent. Produces zcrdrm-agent.msi via
    # WiX 4 on a real Windows runner, then installs it silently and
    # asserts the registry/files landed where the .wxs claims. Without
    # this gate the Mac dev box has no way to know the MSI works.
    runs-on: windows-latest
    timeout-minutes: 25
    needs: build-windows
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX 5 toolset
        # WiX 5 (not WiX 4): the `<Files Include="**\*"/>` bulk-harvest
        # element used in Product.wxs is a WiX-5-and-later feature.
        # WiX 5 keeps the same `schemas/v4/wxs` XML namespace and is
        # source-compatible with WiX 4 — only the toolset version bumps.
        # See https://docs.firegiant.com/wix/fivefour/.
        # Pinned to a specific version so demo-prep day doesn't get
        # surprised by an upstream release.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        working-directory: deploy/windows-msi
        shell: pwsh
        run: .\build-msi.ps1

      - name: Install MSI silently
        shell: pwsh
        run: |
          $msi = Resolve-Path "deploy\windows-msi\zcrdrm-agent.msi"
          Write-Host "Installing $msi"
          $proc = Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "msiexec exit code $($proc.ExitCode)" -ForegroundColor Red
            Get-Content install.log -Tail 200
            throw "MSI install failed"
          }
          Write-Host "MSI installed."

      - name: Verify file payload
        shell: pwsh
        run: |
          $files = @(
            "C:\Program Files\zcrDRM\Drm.Agent.Tray.Windows.exe",
            "C:\Program Files\zcrDRM\Drm.Viewer.Windows.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              throw "Missing expected file after install: $f"
            }
            Write-Host "  OK $f"
          }

      - name: Verify registry — server URL baked in
        shell: pwsh
        run: |
          $key = Get-ItemProperty -Path "HKLM:\SOFTWARE\zcrDRM" -ErrorAction Stop
          if ($key.ServerUrl -ne "https://drm.zcr.ai") {
            throw "Expected HKLM\SOFTWARE\zcrDRM\ServerUrl = https://drm.zcr.ai, got '$($key.ServerUrl)'"
          }
          Write-Host "  OK ServerUrl = $($key.ServerUrl)"
          Write-Host "  OK Version   = $($key.Version)"

      - name: Verify registry — .drmx file association
        shell: pwsh
        run: |
          $drmxKey = Get-Item -Path "Registry::HKEY_CLASSES_ROOT\.drmx" -ErrorAction Stop
          $progId = $drmxKey.GetValue("")
          if ($progId -ne "zcrDRM.ProtectedFile.1") {
            throw "Expected .drmx ProgID = zcrDRM.ProtectedFile.1, got '$progId'"
          }
          Write-Host "  OK .drmx -> $progId"
          $openCmd = (Get-Item -Path "Registry::HKEY_CLASSES_ROOT\zcrDRM.ProtectedFile.1\shell\open\command").GetValue("")
          if ($openCmd -notlike "*Drm.Viewer.Windows.exe*") {
            throw "Expected viewer in open command, got '$openCmd'"
          }
          Write-Host "  OK open command points at the viewer"

      - name: Verify registry — Protect-with-zcrDRM shell menu
        shell: pwsh
        # `HKEY_CLASSES_ROOT\*\shell\zcrDRMProtect` contains a literal
        # `*` (the all-files registration key). PowerShell's -Path
        # treats `*` as a wildcard, so we have to use -LiteralPath to
        # match the actual `*` key. Same applies in the uninstall check.
        run: |
          $menuKey = Get-Item -LiteralPath "Registry::HKEY_CLASSES_ROOT\*\shell\zcrDRMProtect" -ErrorAction Stop
          $muiVerb = $menuKey.GetValue("MUIVerb")
          if ($muiVerb -ne "Protect with zcrDRM") {
            throw "Expected MUIVerb = 'Protect with zcrDRM', got '$muiVerb'"
          }
          Write-Host "  OK *\\shell\\zcrDRMProtect MUIVerb = $muiVerb"
          foreach ($sub in @("01quicksend","02protect","03transparent")) {
            $subKey = Get-Item -LiteralPath "Registry::HKEY_CLASSES_ROOT\zcrDRM.ProtectSubmenu\shell\$sub\command" -ErrorAction Stop
            $cmd = $subKey.GetValue("")
            if ($cmd -notlike "*Drm.Agent.Tray.Windows.exe*") {
              throw "Sub-verb $sub command does not point at the tray exe: $cmd"
            }
            Write-Host "  OK submenu $sub -> tray exe"
          }

      # NOTE: tray auto-start (HKLM\...\Run\zcrDRM Agent) is intentionally
      # NOT in Stage 2 — the tray exe has no --background flag yet (see
      # comment block in Product.wxs). Stage 3 adds the flag + the
      # component + the corresponding verify step.

      - name: Uninstall MSI silently
        shell: pwsh
        run: |
          $msi = Resolve-Path "deploy\windows-msi\zcrdrm-agent.msi"
          $proc = Start-Process msiexec -ArgumentList "/x", "`"$msi`"", "/qn", "/l*v", "uninstall.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "msiexec exit code $($proc.ExitCode)" -ForegroundColor Red
            Get-Content uninstall.log -Tail 200
            throw "MSI uninstall failed"
          }
          Write-Host "MSI uninstalled."

      - name: Verify uninstall — files gone
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\zcrDRM\Drm.Agent.Tray.Windows.exe") {
            throw "Tray exe still present after uninstall — MSI is leaking files."
          }
          Write-Host "  OK install folder cleaned"

      - name: Verify uninstall — registry gone
        shell: pwsh
        # -LiteralPath required for the HKCR \*\ key path (see comment
        # on the install-time verify step).
        run: |
          $stillThere = @()
          if (Test-Path -LiteralPath "HKLM:\SOFTWARE\zcrDRM")                                       { $stillThere += "HKLM\SOFTWARE\zcrDRM" }
          if (Test-Path -LiteralPath "Registry::HKEY_CLASSES_ROOT\.drmx")                            { $stillThere += "HKCR\.drmx" }
          if (Test-Path -LiteralPath "Registry::HKEY_CLASSES_ROOT\*\shell\zcrDRMProtect")            { $stillThere += "HKCR\*\shell\zcrDRMProtect" }
          if (Test-Path -LiteralPath "Registry::HKEY_CLASSES_ROOT\zcrDRM.ProtectedFile.1")           { $stillThere += "HKCR\zcrDRM.ProtectedFile.1" }
          if ($stillThere.Count -gt 0) {
            throw "Registry leak after uninstall: $($stillThere -join ', ')"
          }
          Write-Host "  OK registry fully cleaned"

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcrdrm-agent-msi
          path: deploy/windows-msi/zcrdrm-agent.msi
          retention-days: 30

      - name: Upload install logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-install-logs
          path: |
            install.log
            uninstall.log
          retention-days: 7

  docker:
    name: Docker — build server image
    runs-on: ubuntu-latest
    needs: build-and-test-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: drm-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
